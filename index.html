<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗算アルケミスト RPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #12131C, #08090D);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 520px;
      background: #1D1F2C;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      border: 1px solid #2A2E42;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 放置バトルエリア（非表示用） */
    .battle-area {
      background: #12141E;
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #333850;
      position: relative;
    }

    .battle-area.hidden, .tab-nav.hidden {
      display: none !important;
    }

    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .coin-display {
      color: #FFD700;
      font-weight: bold;
      font-size: 15px;
    }

    .battle-stage-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181A27;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .entity-box {
      font-size: 28px;
      transition: transform 0.1s;
    }

    .hp-bar-bg {
      width: 100%;
      height: 8px;
      background: #2A2E42;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .hp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF5252, #FF7B00);
      width: 100%;
      transition: width 0.1s linear;
    }

    /* タブナビゲーション */
    .tab-nav {
      display: flex;
      gap: 5px;
      background: #12141E;
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      color: #8E95AD;
      border: none;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2D3248;
      color: #FFD700;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .screen.active {
      display: flex;
    }

    /* ボタンデザイン */
    .btn {
      background: linear-gradient(135deg, #FF7B00, #FF5252);
      color: white;
      border: none;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255,82,82,0.3);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      background: #333850;
      box-shadow: none;
    }

    .btn-mode-b {
      background: linear-gradient(135deg, #00B4DB, #0083B0);
      box-shadow: 0 4px 10px rgba(0,180,219,0.3);
    }

    /* メニュー & 学年選択 */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .grade-btn {
      background: #25293C;
      color: #8E95AD;
      border: 2px solid #333850;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .grade-btn.selected {
      background: #FFD700;
      color: #12131C;
      border-color: #FFAA00;
    }

    /* ショップ (アップグレード) */
    .buy-count-toggle {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-bottom: 5px;
    }

    .cnt-btn {
      background: #25293C;
      color: #8E95AD;
      border: 1px solid #333850;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .cnt-btn.active {
      background: #4FACFE;
      color: #fff;
      border-color: #4FACFE;
    }

    .shop-item {
      background: #12141E;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2A2E42;
    }

    .shop-info {
      text-align: left;
    }

    .shop-title {
      font-size: 13px;
      font-weight: bold;
      color: #E2E8F0;
    }

    .shop-desc {
      font-size: 11px;
      color: #8E95AD;
    }

    .shop-lv {
      font-size: 11px;
      color: #FFD700;
    }

    .buy-btn {
      background: #2D3248;
      color: #FFD700;
      border: 1px solid #FFD700;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      min-width: 90px;
    }

    .buy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #555;
      color: #888;
    }

    /* 装備画面 */
    .equip-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .equip-slot {
      background: #12141E;
      border: 1px dashed #333850;
      border-radius: 8px;
      padding: 8px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 11px;
    }

    .equip-slot.equipped {
      border-style: solid;
      border-color: #FFD700;
      background: #1C2030;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      background: #12141E;
      padding: 8px;
      border-radius: 8px;
    }

    .item-card {
      background: #25293C;
      border: 1px solid #333850;
      border-radius: 6px;
      padding: 6px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .item-card.rare-common { border-color: #8E95AD; }
    .item-card.rare-rare { border-color: #00B4DB; color: #00B4DB; }
    .item-card.rare-epic { border-color: #A855F7; color: #A855F7; }
    .item-card.rare-legendary { border-color: #FFD700; color: #FFD700; }

    /* 暗算モード共通 */
    .game-header {
      display: flex;
      justify-content: space-between;
      background: #12141E;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .stat-val { color: #4FACFE; font-weight: bold; }

    .question-box {
      font-size: 32px;
      font-weight: bold;
      background: #12141E;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333850;
    }

    .answer-display {
      font-size: 24px;
      height: 40px;
      background: #12141E;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFD700;
      border: 1px dashed #00B4DB;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .num-btn {
      background: #25293C;
      color: white;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    /* モードB */
    .target-box {
      background: #12141E;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00B4DB;
    }

    .target-num { font-size: 32px; font-weight: bold; color: #00B4DB; }

    .formula-display {
      min-height: 40px;
      background: #12141E;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #FFD700;
      border: 1px dashed #00B4DB;
    }

    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .card-btn {
      background: #25293C;
      color: white;
      border: 1px solid #333850;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .card-btn.op { color: #00B4DB; border-color: #00B4DB; }
    .card-btn:disabled { opacity: 0.3; }

    /* オフライン報酬モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1D1F2C;
      border: 2px solid #FFD700;
      border-radius: 16px;
      padding: 20px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .modal-title {
      font-size: 18px;
      color: #FFD700;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .modal-reward {
      font-size: 28px;
      color: #FFD700;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 放置バトル（暗算中は非表示になります） -->
  <div class="battle-area" id="battle-area">
    <div class="battle-header">
      <div>🪙 コイン: <span id="coin-txt" class="coin-display">0</span></div>
      <div style="font-size: 11px; color: #8E95AD;">ステージ <span id="stage-txt">1</span></div>
    </div>
    <div class="battle-stage-display">
      <div>
        <div class="entity-box" id="hero-anim">🧙‍♂️</div>
        <div style="font-size: 10px; color: #8E95AD;">Hero</div>
      </div>
      <div style="font-size: 12px; color: #FF5252; font-weight: bold;" id="battle-log">VS</div>
      <div>
        <div class="entity-box" id="enemy-anim">👾</div>
        <div style="font-size: 10px; color: #8E95AD;" id="enemy-name">スライム</div>
      </div>
    </div>
    <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill"></div></div>
  </div>

  <!-- タブナビゲーション -->
  <div class="tab-nav" id="tab-nav">
    <button class="tab-btn active" onclick="switchTab('menu')">🎮 暗算</button>
    <button class="tab-btn" onclick="switchTab('shop')">⚡ 強化</button>
    <button class="tab-btn" onclick="switchTab('equip')">⚔️ 装備</button>
  </div>

  <!-- メニュー画面 -->
  <div id="tab-menu" class="screen active">
    <div style="text-align: left; font-size: 12px; color: #FFD700;">📚 学年選択</div>
    <div class="grade-grid">
      <button class="grade-btn selected" id="grade-1" onclick="setGrade(1)">低学年<br>(1・2年)</button>
      <button class="grade-btn" id="grade-3" onclick="setGrade(3)">中学年<br>(3・4年)</button>
      <button class="grade-btn" id="grade-5" onclick="setGrade(5)">高学年<br>(5・6年)</button>
    </div>

    <button class="btn" onclick="startModeA()">モードA: ポーション・ラッシュ</button>
    <button class="btn btn-mode-b" onclick="startModeB()">モードB: マテリアル・シンセシス</button>
  </div>

  <!-- ショップ画面 -->
  <div id="tab-shop" class="screen">
    <div class="buy-count-toggle">
      <button class="cnt-btn active" onclick="setBuyCount(1, this)">x1</button>
      <button class="cnt-btn" onclick="setBuyCount(10, this)">x10</button>
      <button class="cnt-btn" onclick="setBuyCount(100, this)">x100</button>
      <button class="cnt-btn" onclick="setBuyCount('MAX', this)">MAX</button>
    </div>
    <div id="shop-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <!-- 装備画面 -->
  <div id="tab-equip" class="screen">
    <div style="text-align: left; font-size: 12px; color: #FFD700;">⚔️ 現在の装備</div>
    <div class="equip-slots">
      <div class="equip-slot" id="slot-weapon" onclick="unequip('weapon')">
        <span style="color:#8E95AD;">[武器]</span>
        <span>未装備</span>
      </div>
      <div class="equip-slot" id="slot-armor" onclick="unequip('armor')">
        <span style="color:#8E95AD;">[防具]</span>
        <span>未装備</span>
      </div>
      <div class="equip-slot" id="slot-accessory" onclick="unequip('accessory')">
        <span style="color:#8E95AD;">[装飾品]</span>
        <span>未装備</span>
      </div>
    </div>

    <div style="text-align: left; font-size: 12px; color: #FFD700; margin-top: 5px;">🎒 インベントリ（タップで装備）</div>
    <div class="inventory-grid" id="inventory-list"></div>
  </div>

  <!-- モードA: タイムアタック -->
  <div id="mode-a-screen" class="screen">
    <div class="game-header">
      <div>⏰ <span id="mode-a-time" class="stat-val">30</span>s</div>
      <div>スコア: <span id="mode-a-score" class="stat-val">0</span></div>
      <div>コンボ: <span id="mode-a-combo" class="stat-val">0</span></div>
    </div>
    <div class="question-box" id="mode-a-question">12 + 15 = ?</div>
    <div class="answer-display" id="mode-a-answer"></div>
    <div class="keypad">
      <button class="num-btn" onclick="pressNumA(7)">7</button>
      <button class="num-btn" onclick="pressNumA(8)">8</button>
      <button class="num-btn" onclick="pressNumA(9)">9</button>
      <button class="num-btn" onclick="pressNumA(4)">4</button>
      <button class="num-btn" onclick="pressNumA(5)">5</button>
      <button class="num-btn" onclick="pressNumA(6)">6</button>
      <button class="num-btn" onclick="pressNumA(1)">1</button>
      <button class="num-btn" onclick="pressNumA(2)">2</button>
      <button class="num-btn" onclick="pressNumA(3)">3</button>
      <button class="num-btn" onclick="clearA()">C</button>
      <button class="num-btn" onclick="pressNumA(0)">0</button>
      <button class="num-btn" style="background:#FF5252;" onclick="checkAnswerA()">OK</button>
    </div>
    <button class="btn btn-secondary" onclick="exitGame()">中断して戻る</button>
  </div>

  <!-- モードB: ターゲットパズル -->
  <div id="mode-b-screen" class="screen">
    <div class="game-header">
      <div>問題: <span id="mode-b-stage" class="stat-val">1/5</span></div>
      <div>スコア: <span id="mode-b-score" class="stat-val">0</span></div>
    </div>
    <div class="target-box">
      <div style="font-size:10px; color:#8E95AD;">TARGET</div>
      <div class="target-num" id="mode-b-target">24</div>
    </div>
    <div class="formula-display" id="mode-b-formula"></div>
    <div class="cards-grid" id="mode-b-num-cards"></div>
    <div class="cards-grid" id="mode-b-op-cards"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button class="btn btn-secondary" onclick="resetFormulaB()">やり直す</button>
      <button class="btn btn-mode-b" onclick="checkFormulaB()">調合</button>
    </div>
    <button class="btn btn-secondary" onclick="exitGame()">中断して戻る</button>
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen" class="screen">
    <h2 id="result-title">GAME OVER</h2>
    <div style="font-size: 36px; color: #FFD700; font-weight: bold;" id="final-score">0 pt</div>
    <p id="result-msg" style="font-size: 12px; color: #8E95AD;"></p>
    <button class="btn" onclick="exitGame()">メニューに戻る</button>
  </div>
</div>

<!-- オフライン報酬ダイアログ -->
<div id="offline-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title">🌙 おかえりなさい！</div>
    <div style="font-size: 13px; color: #8E95AD;">離れていた時間: <span id="offline-time" style="color:#FFF;">0分</span></div>
    <div class="modal-reward">+<span id="offline-coins">0</span> 🪙</div>
    <p style="font-size: 11px; color: #8E95AD; margin-bottom: 15px;">ヒーローがオフライン中も戦ってコインを集めてくれました！</p>
    <button class="btn" onclick="closeOfflineModal()">受け取る</button>
  </div>
</div>

<script>
  let gameData = {
    coins: 0,
    stage: 1,
    lastTime: Date.now(),
    upgrades: {
      atk: { lv: 1, max: 1500, baseCost: 10, costMult: 1.15, name: '攻撃力', desc: '放置ダメUP' },
      spd: { lv: 1, max: 1500, baseCost: 15, costMult: 1.15, name: '攻撃速度', desc: '攻撃CD短縮' },
      drop: { lv: 1, max: 1500, baseCost: 20, costMult: 1.20, name: 'ドロップ率', desc: '装備ドロップ率UP' },
      coin: { lv: 1, max: 1500, baseCost: 25, costMult: 1.20, name: 'コイン倍率', desc: '獲得コインUP' }
    },
    equipped: { weapon: null, armor: null, accessory: null },
    inventory: []
  };

  let buyAmount = 1;
  let selectedGrade = 1;

  const monsterTypes = [
    { name: 'スライム', icon: '👾', hp: 20 },
    { name: 'ゴブリン', icon: '👺', hp: 50 },
    { name: 'オーク', icon: '👹', hp: 120 },
    { name: 'ドラゴン', icon: '🐉', hp: 300 }
  ];
  let currentEnemy = { name: '', icon: '', hp: 20, maxHp: 20, reward: 5 };
  let autoAttackCd = 0;

  function init() {
    loadGame();
    spawnEnemy();
    renderShop();
    renderEquip();
    checkOfflineEarnings();
    setInterval(gameLoop, 100);
    setInterval(saveGame, 5000);
  }

  function saveGame() {
    gameData.lastTime = Date.now();
    localStorage.setItem('anzan_alchemist_save', JSON.stringify(gameData));
  }

  function loadGame() {
    const saved = localStorage.getItem('anzan_alchemist_save');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        gameData = { ...gameData, ...parsed };
      } catch(e){}
    }
  }

  function checkOfflineEarnings() {
    const now = Date.now();
    const elapsedSec = Math.floor((now - (gameData.lastTime || now)) / 1000);
    
    if (elapsedSec >= 10) {
      const cappedSec = Math.min(elapsedSec, 86400);
      const atk = getStat('atk');
      const spd = getStat('spd');
      const dps = atk * spd;
      
      const coinMult = (1 + (gameData.upgrades.coin.lv - 1) * 0.1) * (1 + getEquipBonus('coin') / 100);
      const estEnemyHp = 20 * Math.pow(1.2, gameData.stage - 1);
      const estEnemyReward = 5 * Math.pow(1.2, gameData.stage - 1) * coinMult;
      
      const coinsPerSec = (dps / estEnemyHp) * estEnemyReward;
      const earnedCoins = Math.floor(coinsPerSec * cappedSec);

      if (earnedCoins > 0) {
        gameData.coins += earnedCoins;
        let timeStr = cappedSec >= 3600 ? `${Math.floor(cappedSec / 3600)}時間 ${Math.floor((cappedSec % 3600) / 60)}分` : `${Math.floor(cappedSec / 60)}分 ${cappedSec % 60}秒`;

        document.getElementById('offline-time').innerText = timeStr;
        document.getElementById('offline-coins').innerText = earnedCoins.toLocaleString();
        document.getElementById('offline-modal').style.display = 'flex';
      }
    }
  }

  function closeOfflineModal() {
    document.getElementById('offline-modal').style.display = 'none';
  }

  function getStat(type) {
    const up = gameData.upgrades[type];
    if (type === 'atk') return Math.floor(up.lv * 5);
    if (type === 'spd') return 1 + (up.lv * 0.005);
    return up.lv;
  }

  function getEquipBonus(type) {
    let total = 0;
    Object.values(gameData.equipped).forEach(eq => {
      if (eq && eq.statType === type) total += eq.statVal;
    });
    return total;
  }

  function spawnEnemy() {
    const typeIdx = (gameData.stage - 1) % monsterTypes.length;
    const base = monsterTypes[typeIdx];
    const mult = Math.pow(1.2, gameData.stage - 1);
    currentEnemy.name = base.name;
    currentEnemy.icon = base.icon;
    currentEnemy.maxHp = Math.floor(base.hp * mult);
    currentEnemy.hp = currentEnemy.maxHp;
    currentEnemy.reward = Math.floor(5 * mult);

    document.getElementById('enemy-anim').innerText = currentEnemy.icon;
    document.getElementById('enemy-name').innerText = currentEnemy.name;
    document.getElementById('stage-txt').innerText = gameData.stage;
    updateHpBar();
  }

  function updateHpBar() {
    const pct = Math.max(0, (currentEnemy.hp / currentEnemy.maxHp) * 100);
    document.getElementById('hp-bar').style.width = pct + '%';
  }

  function gameLoop() {
    document.getElementById('coin-txt').innerText = Math.floor(gameData.coins).toLocaleString();

    autoAttackCd += 0.1 * getStat('spd');
    if (autoAttackCd >= 1.0) {
      autoAttackCd = 0;
      dealDamage(getStat('atk'));
    }
  }

  function dealDamage(amount) {
    currentEnemy.hp -= amount;
    const heroEl = document.getElementById('hero-anim');
    if (heroEl) {
      heroEl.style.transform = 'scale(1.2)';
      setTimeout(() => heroEl.style.transform = 'scale(1)', 100);
    }

    if (currentEnemy.hp <= 0) {
      const coinMult = (1 + (gameData.upgrades.coin.lv - 1) * 0.1) * (1 + getEquipBonus('coin') / 100);
      const gained = Math.floor(currentEnemy.reward * coinMult);
      gameData.coins += gained;

      const dropChance = 0.1 * (1 + gameData.upgrades.drop.lv * 0.05);
      if (Math.random() < dropChance) {
        dropEquipment();
      }

      gameData.stage++;
      spawnEnemy();
    } else {
      updateHpBar();
    }
  }

  function dropEquipment() {
    const types = ['weapon', 'armor', 'accessory'];
    const slot = types[Math.floor(Math.random() * types.length)];
    const r = Math.random();
    let rarity = 'common';
    let mult = 1;
    if (r < 0.05) { rarity = 'legendary'; mult = 5; }
    else if (r < 0.2) { rarity = 'epic'; mult = 3; }
    else if (r < 0.5) { rarity = 'rare'; mult = 2; }

    let statType = 'score';
    let name = '知恵の指輪';
    if (slot === 'weapon') { statType = 'time'; name = '計算の杖'; }
    if (slot === 'armor') { statType = 'coin'; name = '数式のローブ'; }

    const item = {
      id: Date.now(),
      slot, rarity, name, statType,
      statVal: Math.floor((Math.random() * 5 + 5) * mult)
    };

    gameData.inventory.push(item);
    renderEquip();
  }

  function setBuyCount(cnt, btn) {
    buyAmount = cnt;
    document.querySelectorAll('.cnt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderShop();
  }

  function renderShop() {
    const list = document.getElementById('shop-list');
    list.innerHTML = "";

    Object.keys(gameData.upgrades).forEach(key => {
      const up = gameData.upgrades[key];
      const count = getBuyCount(up);
      const cost = getCostForCount(up, count);

      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML = `
        <div class="shop-info">
          <div class="shop-title">${up.name} <span class="shop-lv">Lv.${up.lv}/${up.max}</span></div>
          <div class="shop-desc">${up.desc}</div>
        </div>
        <button class="buy-btn" ${gameData.coins < cost || up.lv >= up.max ? 'disabled' : ''} onclick="buyUpgrade('${key}')">
          ${up.lv >= up.max ? 'MAX' : `+${count} <br>🪙${Math.floor(cost)}`}
        </button>
      `;
      list.appendChild(div);
    });
  }

  function getBuyCount(up) {
    if (buyAmount === 'MAX') {
      let count = 0;
      let currCost = 0;
      let tempLv = up.lv;
      while (tempLv < up.max) {
        let nextCost = up.baseCost * Math.pow(up.costMult, tempLv - 1);
        if (currCost + nextCost > gameData.coins) break;
        currCost += nextCost;
        tempLv++;
        count++;
      }
      return Math.max(1, count);
    }
    return Math.min(buyAmount, up.max - up.lv);
  }

  function getCostForCount(up, count) {
    let total = 0;
    for (let i = 0; i < count; i++) {
      total += up.baseCost * Math.pow(up.costMult, (up.lv + i) - 1);
    }
    return total;
  }

  function buyUpgrade(key) {
    const up = gameData.upgrades[key];
    const count = getBuyCount(up);
    const cost = getCostForCount(up, count);

    if (gameData.coins >= cost && up.lv < up.max) {
      gameData.coins -= cost;
      up.lv += count;
      renderShop();
    }
  }

  function renderEquip() {
    ['weapon', 'armor', 'accessory'].forEach(slot => {
      const el = document.getElementById(`slot-${slot}`);
      const eq = gameData.equipped[slot];
      if (eq) {
        el.className = 'equip-slot equipped';
        el.innerHTML = `<span style="color:#FFD700;">[${eq.name}]</span><span>${getStatDesc(eq)}</span>`;
      } else {
        el.className = 'equip-slot';
        el.innerHTML = `<span style="color:#8E95AD;">[${slot}]</span><span>未装備</span>`;
      }
    });

    const inv = document.getElementById('inventory-list');
    inv.innerHTML = "";
    gameData.inventory.forEach(item => {
      const card = document.createElement('div');
      card.className = `item-card rare-${item.rarity}`;
      card.innerHTML = `<div>${item.name}</div><div>${getStatDesc(item)}</div>`;
      card.onclick = () => equipItem(item);
      inv.appendChild(card);
    });
  }

  function getStatDesc(item) {
    if (item.statType === 'time') return `タイム +${item.statVal}s`;
    if (item.statType === 'score') return `スコア +${item.statVal}%`;
    if (item.statType === 'coin') return `コイン +${item.statVal}%`;
    return '';
  }

  function equipItem(item) {
    if (gameData.equipped[item.slot]) {
      gameData.inventory.push(gameData.equipped[item.slot]);
    }
    gameData.equipped[item.slot] = item;
    gameData.inventory = gameData.inventory.filter(i => i.id !== item.id);
    renderEquip();
  }

  function unequip(slot) {
    if (gameData.equipped[slot]) {
      gameData.inventory.push(gameData.equipped[slot]);
      gameData.equipped[slot] = null;
      renderEquip();
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    if (tab === 'menu') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-menu').classList.add('active');
    } else if (tab === 'shop') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-shop').classList.add('active');
      renderShop();
    } else if (tab === 'equip') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-equip').classList.add('active');
      renderEquip();
    }
  }

  function setGrade(g) {
    selectedGrade = g;
    document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById(`grade-${g}`).classList.add('selected');
  }

  // 暗算ゲーム開始時に放置画面とタブを確実に非表示にする
  function enterGameScreen() {
    document.getElementById('battle-area').classList.add('hidden');
    document.getElementById('tab-nav').classList.add('hidden');
  }

  // メニューに戻るときに放置画面とタブを再表示する
  function exitGame() {
    clearInterval(timerA);
    document.getElementById('battle-area').classList.remove('hidden');
    document.getElementById('tab-nav').classList.remove('hidden');
    switchTab('menu');
  }

  /* ----------------------------------
   * 暗算モードA (タイムアタック)
   * ---------------------------------- */
  let scoreA = 0, comboA = 0, timeA = 30, timerA = null, currentAnsA = 0, inputAnsA = "";

  function startModeA() {
    scoreA = 0; comboA = 0;
    timeA = 30 + getEquipBonus('time');
    inputAnsA = "";
    document.getElementById('mode-a-score').innerText = scoreA;
    document.getElementById('mode-a-combo').innerText = comboA;
    document.getElementById('mode-a-time').innerText = timeA;

    enterGameScreen();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('mode-a-screen').classList.add('active');

    nextQuestionA();
    clearInterval(timerA);
    timerA = setInterval(() => {
      timeA--;
      document.getElementById('mode-a-time').innerText = timeA;
      if (timeA <= 0) {
        clearInterval(timerA);
        endGameA();
      }
    }, 1000);
  }

  function nextQuestionA() {
    inputAnsA = "";
    document.getElementById('mode-a-answer').innerText = "";
    let n1, n2, op;

    if (selectedGrade === 1) {
      if (Math.random() < 0.5) {
        n1 = Math.floor(Math.random() * 20) + 1;
        n2 = Math.floor(Math.random() * 20) + 1;
        op = "+"; currentAnsA = n1 + n2;
      } else {
        n1 = Math.floor(Math.random() * 20) + 10;
        n2 = Math.floor(Math.random() * 10) + 1;
        op = "-"; currentAnsA = n1 - n2;
      }
    } else if (selectedGrade === 3) {
      n1 = Math.floor(Math.random() * 9) + 2;
      n2 = Math.floor(Math.random() * 9) + 1;
      op = "×"; currentAnsA = n1 * n2;
    } else {
      n2 = Math.floor(Math.random() * 8) + 2;
      let ans = Math.floor(Math.random() * 12) + 2;
      n1 = n2 * ans; op = "÷"; currentAnsA = ans;
    }
    document.getElementById('mode-a-question').innerText = `${n1} ${op} ${n2} = ?`;
  }

  function pressNumA(n) {
    if (inputAnsA.length < 4) {
      inputAnsA += n;
      document.getElementById('mode-a-answer').innerText = inputAnsA;
    }
  }

  function clearA() {
    inputAnsA = "";
    document.getElementById('mode-a-answer').innerText = "";
  }

  function checkAnswerA() {
    if (inputAnsA === "") return;
    if (parseInt(inputAnsA) === currentAnsA) {
      comboA++;
      const scoreMult = 1 + getEquipBonus('score') / 100;
      scoreA += Math.floor((100 + comboA * 20) * scoreMult);
      timeA += 2;
      document.getElementById('mode-a-score').innerText = scoreA;
      document.getElementById('mode-a-combo').innerText = comboA;

      dealDamage(getStat('atk') * 5);
      gameData.coins += 10;

      nextQuestionA();
    } else {
      comboA = 0;
      document.getElementById('mode-a-combo').innerText = 0;
      clearA();
    }
  }

  function endGameA() {
    document.getElementById('result-title').innerText = "タイムアップ！";
    document.getElementById('final-score').innerText = scoreA + " pt";
    document.getElementById('result-msg').innerText = `最大コンボ: ${comboA}`;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('result-screen').classList.add('active');
  }

  /* ----------------------------------
   * 暗算モードB (ターゲットパズル)
   * ---------------------------------- */
  let stageB = 1, scoreB = 0, targetNumB = 0, selectedTokensB = [], availableNumsB = [], opsB = ['+', '-'];

  function startModeB() {
    stageB = 1; scoreB = 0;
    opsB = selectedGrade === 1 ? ['+', '-'] : (selectedGrade === 3 ? ['+', '-', '×'] : ['+', '-', '×', '÷']);
    setupStageB();
    
    enterGameScreen();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('mode-b-screen').classList.add('active');
  }

  function setupStageB() {
    selectedTokensB = [];
    document.getElementById('mode-b-stage').innerText = `${stageB}/5`;
    document.getElementById('mode-b-score').innerText = scoreB;

    let maxVal = selectedGrade === 1 ? 9 : 15;
    availableNumsB = [];
    for (let i = 0; i < 4; i++) {
      availableNumsB.push({ id: i, val: Math.floor(Math.random() * maxVal) + 2, used: false });
    }
    targetNumB = (availableNumsB[0].val + availableNumsB[1].val) * availableNumsB[2].val;
    document.getElementById('mode-b-target').innerText = targetNumB;
    renderCardsB();
    updateFormulaDisplayB();
  }

  function renderCardsB() {
    const numGrid = document.getElementById('mode-b-num-cards');
    numGrid.innerHTML = "";
    availableNumsB.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'card-btn';
      btn.innerText = item.val;
      btn.disabled = item.used || (selectedTokensB.length % 2 !== 0);
      btn.onclick = () => {
        item.used = true;
        selectedTokensB.push({ type: 'num', val: item.val, ref: item });
        renderCardsB(); updateFormulaDisplayB();
      };
      numGrid.appendChild(btn);
    });

    const opGrid = document.getElementById('mode-b-op-cards');
    opGrid.innerHTML = "";
    opsB.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'card-btn op';
      btn.innerText = op;
      btn.disabled = (selectedTokensB.length % 2 === 0);
      btn.onclick = () => {
        selectedTokensB.push({ type: 'op', val: op });
        renderCardsB(); updateFormulaDisplayB();
      };
      opGrid.appendChild(btn);
    });
  }

  function resetFormulaB() {
    selectedTokensB.forEach(t => { if (t.type === 'num') t.ref.used = false; });
    selectedTokensB = [];
    renderCardsB(); updateFormulaDisplayB();
  }

  function updateFormulaDisplayB() {
    const display = document.getElementById('mode-b-formula');
    display.innerText = selectedTokensB.length === 0 ? "式を作ろう" : selectedTokensB.map(t => t.val).join(" ");
  }

  function checkFormulaB() {
    if (selectedTokensB.length < 3 || selectedTokensB.length % 2 === 0) return;
    let val = selectedTokensB[0].val;
    for (let i = 1; i < selectedTokensB.length; i += 2) {
      let op = selectedTokensB[i].val;
      let next = selectedTokensB[i+1].val;
      if (op === '+') val += next;
      if (op === '-') val -= next;
      if (op === '×') val *= next;
      if (op === '÷') val = Math.floor(val / next);
    }

    if (val === targetNumB) {
      const scoreMult = 1 + getEquipBonus('score') / 100;
      scoreB += Math.floor(500 * scoreMult);
      dealDamage(getStat('atk') * 10);
      gameData.coins += 50;

      if (stageB < 5) {
        stageB++; setupStageB();
      } else {
        document.getElementById('result-title').innerText = "ステージクリア！";
        document.getElementById('final-score').innerText = scoreB + " pt";
        document.getElementById('result-msg').innerText = "パズルマスター！";
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('result-screen').classList.add('active');
      }
    } else {
      alert(`計算結果: ${val} (目標: ${targetNumB})`);
    }
  }

  init();
</script>
</body>
</html>
